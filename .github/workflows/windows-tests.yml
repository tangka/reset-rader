name: Windows plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node .github/check-windows-runtime.mjs
      # Isolated suites can each start PowerShell/.NET helpers. Bound runner
      # contention without skipping tests or extending production deadlines.
      - run: npm test -- --test-concurrency=2
      - run: npm run check
